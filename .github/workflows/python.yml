name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run sample
        run: python examples/run_sample.py

      - name: Run local diagnostic runner
        run: python examples/run_local.py --skip-network --skip-dns --skip-services

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
